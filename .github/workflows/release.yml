name: Release

# Publish a release: git tag v1.2.3 && git push origin v1.2.3
# The app's updater (Settings → Updates) installs the first .apk of the latest non-draft,
# non-prerelease release, so every release must be signed with the same key.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      RELEASE_SIGN_KEY_ALIAS: ${{ secrets.RELEASE_SIGN_KEY_ALIAS }}
      RELEASE_SIGN_KEY_PASSWORD: ${{ secrets.RELEASE_SIGN_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags are needed for the version (git describe / rev-list)
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The repository has no wrapper script; same version as gradle/wrapper/gradle-wrapper.properties
          gradle-version: "9.3.1"

      - name: Checkout keystore repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.KEYSTORE_GIT_REPOSITORY }}
          token: ${{ secrets.KEYSTORE_ACCESS_TOKEN }}
          path: app/keystore

      - name: Check signing secrets
        run: |
          for name in KEYSTORE_FILE KEYSTORE_PASSWORD RELEASE_SIGN_KEY_ALIAS RELEASE_SIGN_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set"
              exit 1
            fi
          done
          if [ ! -f "app/$KEYSTORE_FILE" ]; then
            echo "::error::Keystore app/$KEYSTORE_FILE not found (KEYSTORE_FILE is relative to the app module)"
            exit 1
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Check APK
        run: |
          # An unsigned build is called app-release-unsigned.apk: never publish it
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Signed APK not found"; ls -la app/build/outputs/apk/release; exit 1; }
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
